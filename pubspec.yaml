name: kingsng_roleplay
description: Kings Nigeria Roleplay - Official Launcher
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.4
  http: ^1.2.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  archive: ^3.4.10
  android_intent_plus: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/video/
